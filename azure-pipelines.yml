# Pipeline do devtrack-foundation-core (@devtrack-solution/foundation-api), change
# split-foundation-repositories, D5.
#
# Gates: os mesmos do .github/workflows/ci.yml do monorepo para a Foundation, um job por gate.
# Publicação: só em tag v<versão> igual ao package.json, depois de todos os gates verdes.
#
# Variáveis do pipeline (definidas na UI do Azure DevOps, não no repositório):
#   DEVTRACK_REGISTRY        URL do registry do escopo @devtrack-solution (D6)
#   DEVTRACK_REGISTRY_TOKEN  secreta, token de publicação (só o job de publicação recebe)
#
# PR: o Azure Repos ignora a chave `pr:`. A validação de PR é a política de branch da main
# (Build validation apontando para este pipeline).

trigger:
  branches:
    include: [main]
  tags:
    include: ['v*']

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '24.21.0'
  # Instalador canônico usado pelo kit de conformidade (D9).
  API_CLI_VERSION: '0.1.0'

stages:
  - stage: gates
    displayName: Gates
    jobs:
      - job: imports
        displayName: imports
        timeoutInMinutes: 15
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run check:boundaries
            displayName: Verificar fronteiras de imports
          - script: npm run test:boundaries
            displayName: Testar verificador de fronteiras

      - job: lint_typecheck
        displayName: lint-typecheck
        timeoutInMinutes: 15
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run lint:check
            displayName: Lint
          - script: npm run typecheck
            displayName: Typecheck

      - job: unit
        displayName: unit
        timeoutInMinutes: 20
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm test -- --runInBand --ci
            displayName: Testes unitários

      - job: contracts
        displayName: contracts
        timeoutInMinutes: 20
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run test:contracts
            displayName: Testes de contrato

      - job: composition
        displayName: composition
        timeoutInMinutes: 20
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run compose -- --check
            displayName: Verificar composição gerada
          - script: npm run test:e2e -- --runInBand --ci
            displayName: Testes e2e de composição

      - job: integration
        displayName: integration
        timeoutInMinutes: 30
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - bash: |
              set -euo pipefail
              if ls test/persistence*.e2e-spec.ts >/dev/null 2>&1; then
                npx jest --config ./test/jest-e2e.json --runInBand --ci --testPathPatterns persistence
              else
                echo "sem testes de integração: nenhum test/persistence*.e2e-spec.ts encontrado"
              fi
            displayName: Testes de integração de persistência (Testcontainers)

      - job: artifact
        displayName: artifact
        timeoutInMinutes: 30
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run test:artifact
            displayName: Testes do artefato
          - bash: |
              set -euo pipefail
              out="$AGENT_TEMPDIRECTORY/artifact"
              evidence="$BUILD_ARTIFACTSTAGINGDIRECTORY/evidence"
              rm -rf "$out"
              npx ts-node --transpile-only scripts/build-artifact.ts --profile config/composition.yaml --out "$out"
              mkdir -p "$evidence"
              cp "$out/artifact-inventory.json" "$out/package-lock.json" "$evidence/"
              {
                echo "commit_sha=$BUILD_SOURCEVERSION"
                echo "node_version=$(node -v)"
                echo "npm_version=$(npm -v)"
                echo "host_lock_sha256=$(sha256sum package-lock.json | cut -d' ' -f1)"
                echo "artifact_lock_sha256=$(sha256sum "$out/package-lock.json" | cut -d' ' -f1)"
              } > "$evidence/ci-evidence.txt"
              cat "$evidence/ci-evidence.txt"
            displayName: Build seletivo do artefato e evidência
          - task: PublishPipelineArtifact@1
            displayName: Publicar evidência do artefato
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/evidence
              artifact: foundation-artifact-$(Build.SourceVersion)

      - job: publishable
        displayName: publishable
        timeoutInMinutes: 20
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { registry: false }
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run test:publishable
            displayName: Testes do verificador de publicação
          - script: npm run build && npm run check:publishable
            displayName: 'Pacote publicável (sem file, link ou caminho de checkout)'

      - job: module_conformance
        displayName: module-conformance
        timeoutInMinutes: 30
        steps:
          - template: .azure-pipelines/setup.yml
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - bash: |
              set -euo pipefail
              prefix="$AGENT_TEMPDIRECTORY/api-cli"
              mkdir -p "$prefix"
              echo '{"name":"ci-api-cli","version":"1.0.0","private":true}' > "$prefix/package.json"
              npm install --prefix "$prefix" "@devtrack-solution/api-cli@$API_CLI_VERSION" --no-audit --no-fund
              echo "##vso[task.setvariable variable=DEVTRACK_API_CLI_ROOT]$prefix/node_modules/@devtrack-solution/api-cli"
            displayName: Instalar @devtrack-solution/api-cli $(API_CLI_VERSION) num prefixo separado
          - script: npm run test:conformance
            displayName: Kit de conformidade (exits 0/1/2, fixture inválida e qualificação publicada)

  - stage: publish
    displayName: Publicar
    dependsOn: gates
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: publish
        displayName: npm publish
        timeoutInMinutes: 20
        steps:
          - template: .azure-pipelines/setup.yml
            parameters: { auth: true }
          - bash: |
              set -euo pipefail
              version="$(node -p "require('./package.json').version")"
              tag="${BUILD_SOURCEBRANCH#refs/tags/}"
              if [ "$tag" != "v$version" ]; then
                echo "##vso[task.logissue type=error]tag $tag não corresponde ao package.json (v$version)"
                exit 1
              fi
            displayName: Tag igual à versão
          - script: npm ci
            displayName: Instalar dependências (lock obrigatório)
          - script: npm run build
            displayName: Build
          - script: npm publish
            displayName: Publicar @devtrack-solution/foundation-api no DEVTRACK_REGISTRY
